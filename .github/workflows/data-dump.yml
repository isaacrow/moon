# Nightly data dump: every published record as JSON-LD and N-Triples, saved (gzipped) to the GitHub
# release "data-dump", replacing last night's files. The live, always-current files are at
# https://mooon.site/resource/dump.jsonld and https://mooon.site/resource/dump.nt.
name: Nightly data dump

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC, 03:30 in Baghdad
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download the dump files
        run: |
          set -euo pipefail
          for f in jsonld nt; do
            curl -fsS --retry 3 --max-time 300 -D "headers.$f" -o "moon-published-records.$f" "https://mooon.site/resource/dump.$f"
          done
          count=$(grep -i '^x-record-count:' headers.jsonld | tr -d '\r' | awk '{print $2}')
          python3 -c "import json; d=json.load(open('moon-published-records.jsonld')); assert isinstance(d.get('@graph'), list)"
          test -s moon-published-records.nt
          echo "COUNT=${count:-?}" >> "$GITHUB_ENV"
          gzip -9 -k moon-published-records.jsonld moon-published-records.nt
          ls -l moon-published-records.*

      - name: Publish to the data-dump release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="Every published Moon record as linked data (BIBFRAME), dumped $(date -u +'%Y-%m-%d %H:%M UTC'): ${COUNT} records. Always-current files: https://mooon.site/resource/dump.jsonld and https://mooon.site/resource/dump.nt"
          if ! gh release view data-dump >/dev/null 2>&1; then
            gh release create data-dump --title "Moon data dump" --notes "$notes" --latest=false
          else
            gh release edit data-dump --notes "$notes"
          fi
          gh release upload data-dump moon-published-records.jsonld.gz moon-published-records.nt.gz --clobber
