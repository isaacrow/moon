# Runs the Library of Congress's own converters both ways and compares them with Moon: its BIBFRAME -> MARC converter (lcnetdev/bibframe2marc, XSLT 1.0) on Moon's
# published records written as bounded RDF/XML, and reports how many LC's tool could read and what it made.
# Phase 9 of the plan: "match LC's own BIBFRAME tools". Reported, not yet blocking.
name: LC conformance

on:
  pull_request:
    paths:
      - 'supabase/functions/server/rdfXml.tsx'
      - 'supabase/functions/server/linkedData.tsx'
      - 'scripts/lc-rdfxml-samples.mts'
      - 'scripts/lc-compare.mts'
      - 'src/services/marc/**'
      - '.github/workflows/lc-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bibframe2marc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install xsltproc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xsltproc
      - name: Build LC's bibframe2marc stylesheet
        run: |
          git clone --depth 1 https://github.com/lcnetdev/bibframe2marc.git lc-b2m
          make -C lc-b2m
          ls -l lc-b2m/bibframe2marc.xsl
      - name: Moon records as bounded RDF/XML, and Moon's own MARC export of each
        run: npx tsx scripts/lc-rdfxml-samples.mts lc-check/rdf 50 lc-check/moon-marc
      - name: Convert with LC's bibframe2marc
        run: |
          mkdir -p lc-check/marc
          ok=0; bad=0; no245=0
          for f in lc-check/rdf/*.rdf; do
            id=$(basename "$f" .rdf)
            if xsltproc --stringparam pRecordId "$id" lc-b2m/bibframe2marc.xsl "$f" > "lc-check/marc/$id.xml" 2> "lc-check/marc/$id.err"; then
              if grep -q 'tag="245"' "lc-check/marc/$id.xml"; then ok=$((ok+1)); else no245=$((no245+1)); echo "::warning::$id: converted, but no 245 title field"; fi
            else
              bad=$((bad+1)); echo "::warning::$id: bibframe2marc failed: $(head -c 300 lc-check/marc/$id.err)"
            fi
          done
          echo "### LC bibframe2marc on Moon's bounded RDF/XML" >> "$GITHUB_STEP_SUMMARY"
          echo "- Converted with a 245 title: **$ok**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Converted without a 245: $no245" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: $bad" >> "$GITHUB_STEP_SUMMARY"
          first=$(ls lc-check/marc/*.xml | head -1)
          echo '<details><summary>First record as MARCXML</summary>' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"; echo '```xml' >> "$GITHUB_STEP_SUMMARY"
          head -c 6000 "$first" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; echo '</details>' >> "$GITHUB_STEP_SUMMARY"
      - name: Get LC's marc2bibframe2 (MARC -> BIBFRAME)
        run: git clone --depth 1 https://github.com/lcnetdev/marc2bibframe2.git lc-m2b
      - name: Convert Moon's MARC export with LC's marc2bibframe2
        run: |
          mkdir -p lc-check/lc-bf
          for f in lc-check/moon-marc/*.xml; do
            id=$(basename "$f" .xml)
            xsltproc --stringparam baseuri "https://mooon.site/lc-check/$id/" lc-m2b/xsl/marc2bibframe2.xsl "$f" > "lc-check/lc-bf/$id.rdf" 2> "lc-check/lc-bf/$id.err" \
              || echo "::warning::$id: marc2bibframe2 failed: $(head -c 300 lc-check/lc-bf/$id.err)"
          done
      - name: Compare Moon with LC's converters
        run: npx tsx scripts/lc-compare.mts lc-check/moon-marc lc-check/marc lc-check/lc-bf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc-bibframe2marc-output
          path: lc-check/
          retention-days: 14
