name: Copy records to the records table

# Run by hand from the Actions tab (or `gh workflow run copy-records.yml -f mode=dry-run`).
# Both modes first back up every key-value record; the backup and a report are kept as a
# workflow artifact for 90 days. The key-value rows themselves are never changed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: copy and roll back, keep nothing. apply: copy for real.'
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: copy-records
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: gfbagczwhvxxstbfrfhu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Back up and copy (${{ inputs.mode }})
        run: node scripts/copy-kv-records.mjs --${{ inputs.mode }}

      - name: Keep the backup and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ inputs.mode }}-${{ github.run_number }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
